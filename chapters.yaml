# ============================================================
# chapters.yaml - 과목/대분류/단원 목록
# ============================================================
# 텔레그램 봇의 선택 버튼은 전적으로 이 파일에서 만들어집니다.
# 이 파일에 없는 과목/단원은 봇 화면에 나타나지 않습니다.
#
# [수정 방법]
#   1. 아래 형식대로 항목을 추가/수정/삭제합니다.
#   2. 봇을 껐다가 다시 켭니다 (Ctrl+C 후 재실행).
#   3. 코드나 노션은 건드릴 필요가 없습니다.
#
# [형식]
#   과목:
#     대분류:
#       - 단원
#   → 노션에는 "대분류-단원" 형태로 저장됩니다.
#     (예: 중회-제05장 재고자산과 농림어업자산)
#
# [주의]
#   - 들여쓰기는 반드시 공백 2칸 단위 (탭 문자 금지)
#   - 단원 이름에 콜론(:)을 쓰려면 따옴표로 감싸기
#   - 장 번호는 두 자리로 적습니다 (제1장 X → 제01장 O)
#     한 자리로 적으면 노션에서 제1장 → 제10장 → 제2장 순으로
#     정렬이 어긋납니다.
#   - 이미 노션에 저장된 기록의 단원 이름을 여기서 바꿔도
#     기존 노션 기록은 그대로 남습니다 (자동으로 안 바뀜)
# ============================================================


